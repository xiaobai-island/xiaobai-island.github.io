<html lang="zh-CN">

    if (location.hash !== "#island") document.documentElement.classList.add("nav-mode");
  </script>

<body>
  <div class="backdrop"></div>
  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="world" id="world">
        <img class="map-bg" id="mapBg" alt="" draggable="false" decoding="async"
          src="assets/map-bg-1600.webp" />
        <div class="layer boats" id="boats"></div>
        <div class="layer houses" id="houses"></div>
        <div class="layer clouds" id="clouds"></div>
        <div class="layer labels" id="labels"></div>
      </div>
    </div>
    <a class="nav-btn" id="navBtn" href="#">🧭 简洁导航</a>
    <button type="button" class="rotate-btn" id="rotateBtn" hidden></button>
  </div>

  <!-- 简易导航：首页默认显示，地图在它下面后台加载 -->
  <div class="nav-page" id="navPage">
    <main>
      <header>
        <h1>🏝️ 应用导航</h1>
        <a class="nav-enter" id="navEnter" href="#island"><i></i><span>🗺️ 进入小白岛</span></a>
      </header>
      <ul class="nav-list" id="navList"></ul>
    </main>
  </div>

  <script src="config.js?v=20261106140512"></script>
  <script>
    (function () {
      const cfg = window.MAP_CONFIG;
      const list = document.getElementById("navList");
      // 名称末尾的 emoji 拿来当图标，前面的文字当标题
      const EMOJI_TAIL = /\s*(\p{Extended_Pictographic}[\p{Extended_Pictographic}\uFE0F\u200D]*)$/u;
      cfg.sites
        .concat(cfg.navExtra || [])
        .filter((s) => s.name && s.url)
        .forEach((s) => {
          const m = s.name.match(EMOJI_TAIL);
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "nav-item";
          a.href = s.url;
          if (cfg.openInNewTab) {
            a.target = "_blank";
            a.rel = "noopener";
          }
          a.innerHTML = `<span class="nav-icon"></span><span class="nav-text"><div class="nav-name"></div><div class="nav-desc"></div></span>`;
          a.querySelector(".nav-icon").textContent = m ? m[1] : "🔗";
          a.querySelector(".nav-name").textContent = m ? s.name.slice(0, m.index) : s.name;
          a.querySelector(".nav-desc").textContent = s.desc || new URL(s.url).host;
          li.append(a);
          list.append(li);
        });
    })();
  </script>
  <script src="app.js?v=20261106140512"></script></body>
</html>
