<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>小白岛 · 应用导航</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(28px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
        calc(28px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
      background: linear-gradient(#5fb8f0, #2b8fd6) fixed;
      color: #6e3d14;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    main { max-width: 720px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    h1 {
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 2px 0 rgba(30, 90, 150, 0.6);
    }

    /* 和首页按钮同一套木牌风格 */
    .back {
      flex: none;
      padding: 8px 13px;
      border: 1.5px solid #fff3d6;
      border-radius: 18px;
      background: linear-gradient(#c8873f, #9a5a23);
      box-shadow: 0 2px 0 #6e3d14, 0 4px 10px rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      text-shadow: 0 1px 0 #6e3d14;
    }

    .back:active { transform: translateY(1px); }

    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      list-style: none;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 6px 18px rgba(0, 50, 100, 0.18);
      color: inherit;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }

    .item:hover,
    .item:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 50, 100, 0.26);
      outline: none;
    }

    .item:active { transform: scale(0.98); }

    .icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(#ffe7a8, #f7c25a);
      box-shadow: inset 0 -2px 0 rgba(110, 61, 20, 0.25);
      font-size: 26px;
    }

    .text { min-width: 0; }

    .name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .desc {
      margin-top: 3px;
      overflow: hidden;
      color: #9a6a3f;
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🏝️ 应用导航</h1>
      <a class="back" href="index.html">🗺️ 回小白岛</a>
    </header>
    <ul class="list" id="list"></ul>
  </main>

  <script src="config.js?v=20261105181642"></script>
  <script>
    (function () {
      const cfg = window.MAP_CONFIG;
      const list = document.getElementById("list");
      // 名称末尾的 emoji 拿来当图标，前面的文字当标题
      const EMOJI_TAIL = /\s*(\p{Extended_Pictographic}[\p{Extended_Pictographic}\uFE0F\u200D]*)$/u;
      cfg.sites
        .concat(cfg.navExtra || [])
        .filter((s) => s.name && s.url)
        .forEach((s) => {
          const m = s.name.match(EMOJI_TAIL);
          const title = m ? s.name.slice(0, m.index) : s.name;
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "item";
          a.href = s.url;
          if (cfg.openInNewTab) {
            a.target = "_blank";
            a.rel = "noopener";
          }
          a.innerHTML = `<span class="icon"></span><span class="text"><div class="name"></div><div class="desc"></div></span>`;
          a.querySelector(".icon").textContent = m ? m[1] : "🔗";
          a.querySelector(".name").textContent = title;
          a.querySelector(".desc").textContent = s.desc || new URL(s.url).host;
          li.append(a);
          list.append(li);
        });
    })();
  </script>
</body>
</html>
